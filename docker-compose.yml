# Reviewer-facing stack: `docker compose up --build` runs everything with only
# Docker installed (no Node/pnpm/Postgres on the host).
#
#   http://localhost:8000/api/docs   Swagger / OpenAPI UI
#   http://localhost:8080            Web UI
#
# The default set is api + db + web. The one-off seeder and cleaner are gated
# behind the "tools" profile and are only run on demand:
#   docker compose --profile tools run --rm --build seed
#   docker compose --profile tools run --rm --build clean
name: todo-list

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-todo-list_db}
    ports:
      - '5432:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-todo-list_db}',
        ]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Creates the separate `todo-list_test` database on first initialisation.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

  # Applies Drizzle migrations as a one-shot job, then exits. The API waits for
  # it to complete successfully before starting.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    command: ['node', 'dist/db/migrate.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-todo-list_db}
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-todo-list_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      PORT: '8000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://localhost:8000/api/readyz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - '8080:80'
    depends_on:
      api:
        condition: service_healthy

  # One-off demo seeder. Gated behind the "tools" profile so `docker compose up`
  # ignores it. Run with:
  #   docker compose --profile tools run --rm --build seed
  seed:
    profiles: ['tools']
    build:
      context: .
      dockerfile: Dockerfile
      target: build-api
    command: ['pnpm', '--filter', '@todo-list/api', 'seed']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-todo-list_db}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # One-off cleaner: empties the list but keeps the schema and migrations.
  # Run with:
  #   docker compose --profile tools run --rm --build clean
  clean:
    profiles: ['tools']
    build:
      context: .
      dockerfile: Dockerfile
      target: build-api
    command: ['pnpm', '--filter', '@todo-list/api', 'db:clean']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-todo-list_db}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
